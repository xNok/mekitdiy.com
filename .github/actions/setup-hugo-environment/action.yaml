name: 'Setup Hugo Environment'
description: 'Sets up Hugo, Node.js, dependencies, and Playwright browsers for testing and building Hugo sites'

inputs:
  hugo-version:
    description: 'Hugo version to install'
    required: false
    default: '0.155.2'
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'
  install-playwright:
    description: 'Whether to install Playwright browser dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: website
      run: npm ci

    - name: Get Playwright version
      if: inputs.install-playwright == 'true'
      id: playwright-version
      shell: bash
      working-directory: website
      run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']" | tr -cd 'a-zA-Z0-9._+-')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright OS Dependencies
      if: inputs.install-playwright == 'true'
      shell: bash
      working-directory: website
      run: npx playwright install-deps chromium

    - name: Install Playwright Browsers
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: website
      run: npx playwright install chromium
